<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Smiling Eyes (Joyful Arcs) -->
  <path d="M19 26 Q24 19 29 26" fill="none" stroke="url(#smileGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M35 26 Q40 19 45 26" fill="none" stroke="url(#smileGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Happy Smile Arc -->
  <path d="M21 37 Q32 50 43 37" fill="none" stroke="url(#smileGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Tiny Sparkle Accent -->
  <path d="M47 13 L48.5 17 L52.5 18.5 L48.5 20 L47 24 L45.5 20 L41.5 18.5 L45.5 17 Z" fill="#fde047" />
</svg>
